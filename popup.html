<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Bookmarks</title>
  <link rel="stylesheet" href="css/popup.css">
  <style>
    /* Inline styles for popup specifics or use css/styles.css */
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }
    .container {
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Bookmarks</h2>
      <button id="copy-btn" title="Copy to Clipboard">📋</button>
    </div>
    <div id="bookmarks-list" class="bookmarks-list"></div>
    <div id="empty-state" class="hidden">No bookmarks yet.</div>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
